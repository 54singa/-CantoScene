services:
  - type: web
    name: cantoscene-api
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:server && pnpm --filter @canto-scene/server db:deploy && pnpm --filter @canto-scene/server db:seed
    startCommand: pnpm --filter @canto-scene/server start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: FRONTEND_ORIGIN
        value: https://cantoscene-web.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_TIMEOUT_MS
        value: "30000"

  - type: web
    name: cantoscene-web
    runtime: static
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cantoscene-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
